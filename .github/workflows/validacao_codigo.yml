name: Deploy to S3 via Terraform

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'App/**'
      - 'Infraestrutura/**'
      - '.github/workflows/**'

jobs:
  test_and_validate:
    name: Test and Validate Code
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Validação de sintaxe HTML
      - name: Validate HTML
        uses: anishathalye/proof-html@v2
        with:
          directory: ./App
          # Ignore empty alt and favicon checks to prevent strict breaking
          ignore_missing_alt: true
          check_favicon: false
          #Ignora os links do Instagram, pois a plataforma tem anti bots
          options: --disable-external

      # 2. Checagem de Links Quebrados no código estático
      - name: Check Broken Links
        uses: lycheeverse/lychee-action@v1.9.3
        with:
          # Verifica links locais e URLs relativas dentro da pasta application
          args: "--offline --include-fragments ./app/**/*.html"

      # 3. Validação do Terraform
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init (Backend only)
        working-directory: ./Infraestrutura
        run: terraform init -backend=false

      - name: Terraform Format Check
        working-directory: ./Infraestrutura
        run: terraform fmt -check

      - name: Terraform Validate
        working-directory: ./Infraestrutura
        run: terraform validate

  deploy:
    name: Terraform Apply & S3 Sync
    runs-on: ubuntu-latest
    needs: test_and_validate # O deploy ocorre SOMENTE se os testes passarem

    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_REGION: "us-east-1"

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.7.0"

      - name: Terraform Init
        working-directory: ./Infraestrutura
        run: terraform init

      - name: Terraform Apply
        working-directory: ./Infraestrutura
        run: terraform apply -auto-approve