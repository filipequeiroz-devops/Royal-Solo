<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sobre - Royal Solo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --gold: #D4AF37;
            --dark-gold: #B8860B;
            --black: #000000;
            --white: #FFFFFF;
            --gray: #222222;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            color: var(--black);
            background-color: var(--white);
            overflow-x: hidden;
        }

        header {
            background: linear-gradient(to right, var(--black), var(--gray), var(--black));
            color: var(--gold);
            padding: 2rem 1rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none"><path fill="%23D4AF37" opacity="0.1" d="M0,0 L100,0 L100,100 L0,100 Z" /></svg>');
            background-size: cover;
            z-index: 0;
        }

        header h1 {
            position: relative;
            z-index: 1;
            font-size: 3rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            margin-bottom: 0.5rem;
            animation: fadeIn 1.5s ease-in-out;
        }

        header p {
            position: relative;
            z-index: 1;
            font-size: 1.2rem;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            animation: fadeIn 2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        nav {
            display: flex;
            justify-content: center;
            background: var(--black);
            padding: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 10px rgba(212, 175, 55, 0.3);
        }

        nav a {
            color: var(--gold);
            text-decoration: none;
            padding: 0.5rem 1.5rem;
            margin: 0 0.5rem;
            font-weight: bold;
            letter-spacing: 1px;
            position: relative;
            text-transform: uppercase;
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background: var(--gold);
            transition: all 0.3s ease;
        }

        nav a:hover::after {
            width: 100%;
            left: 0;
        }

        nav a:hover {
            color: var(--dark-gold);
        }
</head>
<body>
    <header>
        <h1>Royal Solo</h1>
        <p>Conheça minha história</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="sobre.html">Sobre</a>
        <a href="contato.html">Contato</a>
    </nav>

    <section class="about-section">
        <h2 class="section-title">Minha História</h2>

        <div class="about-content">
            <div class="about-text">
                <p>Meu nome é Filipe, toco em eventos (principalmente casamentos) há 5 anos. Meu foco é música pop no geral como Ed Sheeran, Bruno Mars, John Legend e assim por diante.</p>
                <p>Comecei a estudar violino aos 12 anos e desde então me apaixonei pela música. Ao longo dos anos, desenvolvi um repertório especializado em música pop adaptada para violino solo, trazendo um toque sofisticado e único para cada evento.</p>
                <p>Já me apresentei em diversos tipos de eventos, desde casamentos íntimos até grandes festas corporativas, sempre buscando criar a atmosfera perfeita para cada ocasião.</p>
            </div>

            <div class="experience-card">
                <i class="fas fa-music experience-icon"></i>
                <h3>5+ Anos</h3>
                <p>de experiência em eventos</p>
            </div>
        </div>

        <div class="music-genres">
            <h3>Estilos Musicais</h3>
            <div class="genre-tags">
                <span class="genre-tag">Pop</span>
                <span class="genre-tag">Romântico</span>
                <span class="genre-tag">Clássico</span>
                <span class="genre-tag">MPB</span>
            </div>
        </div>
    </section>

    <footer>
        <div class="footer-content">
            <p>&copy; 2026 Royal Solo - Todos os direitos reservados</p>
            <div class="social-links">
                <a href="https://instagram.com/royalsolo" target="_blank"><i class="fab fa-instagram"></i></a>
                <a href="https://wa.me/5511999999999" target="_blank"><i class="fab fa-whatsapp"></i></a>
                <a href="mailto:contato@royalsolo.com"><i class="fas fa-envelope"></i></a>
            </div>
        </div>
    </footer>

    <script>
        // Efeito de rolagem suave
        document.querySelectorAll('nav a').forEach(anchor => {
            anchor.addEventListener('click', function(e) {
                e.preventDefault();
                const targetId = this.getAttribute('href');
                if(targetId === '#') return;

                document.querySelector(targetId).scrollIntoView({
                    behavior: 'smooth'
                });
            });
        });

        // Animação ao rolar a página
        window.addEventListener('scroll', () => {
            const scrollPosition = window.scrollY;
            document.querySelector('nav').style.boxShadow =
                scrollPosition > 10
                    ? '0 2px 15px rgba(212, 175, 55, 0.5)'
                    : '0 2px 10px rgba(212, 175, 55, 0.3)';
        });

        // Efeito pulsante no ícone de experiência
        const experienceIcon = document.querySelector('.experience-icon');
        if(experienceIcon) {
            setInterval(() => {
                experienceIcon.style.transform = 'scale(1.1)';
                experienceIcon.style.color = 'var(--dark-gold)';

                setTimeout(() => {
                    experienceIcon.style.transform = 'scale(1)';
                    experienceIcon.style.color = 'var(--gold)';
                }, 500);
            }, 2000);
        }
    </script>
</body>
</html>
