<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Royal Solo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        :root {
            --gold: #D4AF37;
            --dark-gold: #B8860B;
            --black: #000000;
            --white: #FFFFFF;
            --gray: #222222;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            transition: all 0.3s ease;
        }

        body {
            font-family: 'Arial', sans-serif;
            line-height: 1.6;
            color: var(--black);
            background-color: var(--white);
            overflow-x: hidden;
        }

        header {
            background: linear-gradient(to right, var(--black), var(--gray), var(--black));
            color: var(--gold);
            padding: 2rem 1rem;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        header::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" preserveAspectRatio="none"><path fill="%23D4AF37" opacity="0.1" d="M0,0 L100,0 L100,100 L0,100 Z" /></svg>');
            background-size: cover;
            z-index: 0;
        }

        header h1 {
            position: relative;
            z-index: 1;
            font-size: 3rem;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            margin-bottom: 0.5rem;
            animation: fadeIn 1.5s ease-in-out;
        }

        header p {
            position: relative;
            z-index: 1;
            font-size: 1.2rem;
            text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.5);
            animation: fadeIn 2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        nav {
            display: flex;
            justify-content: center;
            background: var(--black);
            padding: 1rem;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: 0 2px 10px rgba(212, 175, 55, 0.3);
        }

        nav a {
            color: var(--gold);
            text-decoration: none;
            padding: 0.5rem 1.5rem;
            margin: 0 0.5rem;
            font-weight: bold;
            letter-spacing: 1px;
            position: relative;
            text-transform: uppercase;
        }

        nav a::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            width: 0;
            height: 2px;
            background: var(--gold);
            transition: all 0.3s ease;
        }

        nav a:hover::after {
            width: 100%;
            left: 0;
        }

        nav a:hover {
            color: var(--dark-gold);
        }
</head>
<body>
    <header>
        <h1>Royal Solo</h1>
        <p>Entre em contato</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="sobre.html">Sobre</a>
        <a href="contato.html">Contato</a>
    </nav>

    <section class="contact-section">
        <h2 class="section-title">Informações de Contato</h2>
        <div class="contact-container">
            <div class="contact-card">
                <i class="fas fa-phone contact-icon"></i>
                <h3>Telefone</h3>
                <a href="tel:+5511999999999" class="contact-link">(11) 99999-9999</a>
            </div>
            <div class="contact-card">
                <i class="fab fa-whatsapp contact-icon"></i>
                <h3>WhatsApp</h3>
                <a href="https://wa.me/5511999999999" class="contact-link" target="_blank">Enviar Mensagem</a>
            </div>
            <div class="contact-card">
                <i class="fas fa-envelope contact-icon"></i>
                <h3>E-mail</h3>
                <a href="mailto:contato@royalsolo.com" class="contact-link">contato@royalsolo.com</a>
            </div>
            <div class="contact-card">
                <i class="fab fa-instagram contact-icon"></i>
                <h3>Instagram</h3>
                <a href="https://instagram.com/royalsolo" class="contact-link" target="_blank">@royalsolo</a>
            </div>
        </div>
    </section>

    <footer>
        <div class="footer-content">
            <p>&copy; 2026 Royal Solo - Todos os direitos reservados</p>
            <div class="social-links">
                <a href="https://instagram.com/royalsolo" target="_blank"><i class="fab fa-instagram"></i></a>
                <a href="https://wa.me/5511999999999" target="_blank"><i class="fab fa-whatsapp"></i></a>
                <a href="mailto:contato@royalsolo.com"><i class="fas fa-envelope"></i></a>
            </div>
        </div>
    </footer>

    <script>
        // Efeito de rolagem suave
        document.querySelectorAll('nav a').forEach(anchor => {
            anchor.addEventListener('click', function(e) {
                e.preventDefault();
                const targetId = this.getAttribute('href');
                if(targetId === '#') return;

                document.querySelector(targetId).scrollIntoView({
                    behavior: 'smooth'
                });
            });
        });

        // Animação ao rolar a página
        window.addEventListener('scroll', () => {
            const scrollPosition = window.scrollY;
            document.querySelector('nav').style.boxShadow =
                scrollPosition > 10
                    ? '0 2px 15px rgba(212, 175, 55, 0.5)'
                    : '0 2px 10px rgba(212, 175, 55, 0.3)';
        });

        // Efeito hover nos cards de contato
        document.querySelectorAll('.contact-card').forEach(card => {
            card.addEventListener('mouseenter', () => {
                const icon = card.querySelector('.contact-icon');
                icon.style.transform = 'scale(1.2) rotate(5deg)';
                icon.style.color = 'var(--dark-gold)';
            });

            card.addEventListener('mouseleave', () => {
                const icon = card.querySelector('.contact-icon');
                icon.style.transform = 'scale(1) rotate(0)';
                icon.style.color = 'var(--gold)';
            });
        });
    </script>
</body>
</html>
