<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato - Royal Solo</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Royal Solo</h1>
        <p>Entre em contato</p>
    </header>

    <nav>
        <a href="index.html">Home</a>
        <a href="sobre.html">Sobre</a>
        <a href="contato.html">Contato</a>
    </nav>

    <section class="contact-section">
        <h2 class="section-title">Informações de Contato</h2>
        <div class="contact-container">
            <div class="contact-card">
                <i class="fas fa-phone contact-icon"></i>
                <h3>Telefone</h3>
                <a href="tel:+5511971308155" class="contact-link">(11) 97130-8155</a>
            </div>
            <div class="contact-card">
                <i class="fab fa-whatsapp contact-icon"></i>
                <h3>WhatsApp</h3>
                <a href="https://wa.me/5511971308155 class="contact-link" target="_blank">Enviar Mensagem</a>
            </div>
            <div class="contact-card">
                <i class="fas fa-envelope contact-icon"></i>
                <h3>E-mail</h3>
                <a href="mailto:contato@royalsolo.com" class="contact-link">contato@royalsolo.com</a>
            </div>
            <div class="contact-card">
                <i class="fab fa-instagram contact-icon"></i>
                <h3>Instagram</h3>
                <a href="https://www.instagram.com/filipe.royal.solo/" class="contact-link" target="_blank">@royalsolo</a>
            </div>
        </div>
    </section>

    <footer>
        <div class="footer-content">
            <p>&copy; 2026 Royal Solo - Todos os direitos reservados</p>
            <div class="social-links">
                <a href="https://www.instagram.com/filipe.royal.solo/" target="_blank"><i class="fab fa-instagram"></i></a>
                <a href="https://wa.me/5511971308155" target="_blank"><i class="fab fa-whatsapp"></i></a>
                <a href="mailto:contato@royalsolo.com"><i class="fas fa-envelope"></i></a>
            </div>
        </div>
    </footer>

    <script>
        // Efeito de rolagem suave
        document.querySelectorAll('nav a').forEach(anchor => {
            anchor.addEventListener('click', function(e) {
                const targetId = this.getAttribute('href');

                // Só impede o clique padrão e faz o scroll suave se for um link de ID (#)
                if(targetId.startsWith('#') && targetId !== '#') {
                    e.preventDefault();
                    document.querySelector(targetId).scrollIntoView({
                        behavior: 'smooth'
                    });
                }
            });
        });

        // Animação ao rolar a página
        window.addEventListener('scroll', () => {
            const scrollPosition = window.scrollY;
            document.querySelector('nav').style.boxShadow =
                scrollPosition > 10
                    ? '0 2px 15px rgba(212, 175, 55, 0.5)'
                    : '0 2px 10px rgba(212, 175, 55, 0.3)';
        });

        // Efeito hover nos cards de contato
        document.querySelectorAll('.contact-card').forEach(card => {
            card.addEventListener('mouseenter', () => {
                const icon = card.querySelector('.contact-icon');
                icon.style.transform = 'scale(1.2) rotate(5deg)';
                icon.style.color = 'var(--dark-gold)';
            });

            card.addEventListener('mouseleave', () => {
                const icon = card.querySelector('.contact-icon');
                icon.style.transform = 'scale(1) rotate(0)';
                icon.style.color = 'var(--gold)';
            });
        });
    </script>
</body>
</html>
